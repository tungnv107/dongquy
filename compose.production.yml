name: dongquy-production
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dongquy_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?Set DB_OWNER_PASSWORD}
      POSTGRES_DB: dongquy
      APP_DB_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD}
    volumes:
      - production_db:/var/lib/postgresql/data
      - ./scripts/init-production-db.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dongquy_owner -d dongquy']
      interval: 5s
      retries: 20
  migrate:
    build:
      context: .
      target: migrate
      args: { APP_URL: 'https://${DOMAIN:?Set DOMAIN}' }
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set migration database URL with owner role}
    depends_on:
      db: { condition: service_healthy }
    restart: 'no'
  app:
    build:
      context: .
      target: runner
      args: { APP_URL: 'https://${DOMAIN:?Set DOMAIN}' }
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set application database URL}
      APP_URL: https://${DOMAIN:?Set DOMAIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      BANK_WEBHOOK_SECRET: ${BANK_WEBHOOK_SECRET:-}
      TRUST_PROXY: 'true'
      UPLOAD_DIR: /app/uploads
    volumes: ['production_uploads:/app/uploads']
    depends_on:
      migrate: { condition: service_completed_successfully }
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: { condition: service_healthy }
volumes:
  production_db:
  production_uploads:
  caddy_data:
  caddy_config:
