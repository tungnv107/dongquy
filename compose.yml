name: dongquy
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dongquy
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: dongquy
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["db_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dongquy -d dongquy"]
      interval: 5s
      retries: 10
volumes:
  db_data:
